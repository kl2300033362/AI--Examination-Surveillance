name: AI Examination Surveillance (Live Cloud Runner)

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Surveillance session duration in minutes (max 360)"
        required: false
        default: "360"
  push:
    branches: [ main, master ]

jobs:
  run-surveillance:
    name: Run AI Surveillance & Provide Live Access Link
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install System Dependencies (OpenCV, MediaPipe, Audio, SSH, JQ)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            portaudio19-dev \
            libasound2-dev \
            openssh-client \
            curl \
            jq

      - name: Install Python Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Install Frontend Dependencies & Build Single-Port Bundle
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm run build
          cd ..

      - name: Install Cloudflare Tunnel Client (cloudflared)
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared

      - name: Launch AI Surveillance & Generate Public Access Link
        run: |
          # Create runtime directories
          mkdir -p logs data/database data/screenshots backend/data/screenshots
          
          # Start Backend on port 8000 (serves both API & built React frontend)
          echo "Starting AI Surveillance backend on port 8000..."
          python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 &
          BACKEND_PID=$!

          # Wait for backend server to respond
          echo "Waiting for backend server to become ready..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000 > /dev/null 2>&1; then
              echo "Backend is live and responding."
              break
            fi
            sleep 1
          done

          # 1. Start Pinggy Tunnel (ISP-Friendly, bypasses Indian ISP blocks)
          echo "Starting Pinggy tunnel..."
          ssh -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R0:localhost:8000 -L4300:localhost:4300 free.pinggy.io > /tmp/pinggy.log 2>&1 &
          PINGGY_PID=$!

          # 2. Start Cloudflare Tunnel
          echo "Starting Cloudflare public tunnel..."
          cloudflared tunnel --url http://127.0.0.1:8000 --no-autoupdate > /tmp/cloudflared.log 2>&1 &
          CLOUDFLARED_PID=$!

          # 3. Start Localtunnel (secondary backup)
          echo "Starting Localtunnel..."
          npx -y localtunnel --port 8000 > /tmp/localtunnel.log 2>&1 &
          LOCALTUNNEL_PID=$!

          # Wait for Pinggy URL from its debugger API or log
          PINGGY_URL=""
          for i in {1..20}; do
            PINGGY_URL=$(curl -s http://localhost:4300/urls 2>/dev/null | jq -r '.urls[0]' 2>/dev/null || true)
            if [ -n "$PINGGY_URL" ] && [ "$PINGGY_URL" != "null" ]; then
              break
            fi
            # Fallback regex from log
            PINGGY_URL=$(grep -oE 'https://[^ ]+\.pinggy\.link' /tmp/pinggy.log | head -n 1 || true)
            if [ -n "$PINGGY_URL" ]; then
              break
            fi
            sleep 1
          done

          # Wait for Cloudflare URL
          CLOUDFLARE_URL=""
          for i in {1..20}; do
            CLOUDFLARE_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
            if [ -n "$CLOUDFLARE_URL" ]; then
              break
            fi
            sleep 1
          done

          # Wait for Localtunnel URL
          LOCALTUNNEL_URL=""
          for i in {1..20}; do
            LOCALTUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.loca\.lt' /tmp/localtunnel.log | head -n 1 || true)
            if [ -n "$LOCALTUNNEL_URL" ]; then
              break
            fi
            sleep 1
          done

          # Determine Primary URL
          PRIMARY_URL="${PINGGY_URL:-$CLOUDFLARE_URL}"
          PRIMARY_URL="${PRIMARY_URL:-$LOCALTUNNEL_URL}"

          echo "========================================================================"
          echo "🚀 AI EXAMINATION SURVEILLANCE IS LIVE!"
          echo "👉 PINGGY URL (ISP & Mobile Friendly): $PINGGY_URL"
          echo "👉 CLOUDFLARE URL:                    $CLOUDFLARE_URL"
          echo "👉 LOCALTUNNEL URL:                    $LOCALTUNNEL_URL"
          echo "========================================================================"

          # GitHub Actions Notice banner visible at the top of the run page
          echo "::notice title=🚀 Live Surveillance Link (Pinggy)::${PINGGY_URL:-$PRIMARY_URL}"

          # Write rich Markdown to GitHub Step Summary
          cat << 'EOF' > /tmp/summary_header.md
          # 🛡️ AI Online Examination Surveillance Platform is LIVE!

          > ⚠️ **IMPORTANT: The surveillance portal is active ONLY while this GitHub Action is RUNNING (Yellow spinner icon).**
          > Once the status changes to "Success" (Green checkmark), the runner stops and the link expires.
          > To start a new session anytime, click **"Re-run all jobs"** at the top right of this page!

          ### 📱 Click or Tap Either Link Below to Open Surveillance:
          EOF

          cat /tmp/summary_header.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "$PINGGY_URL" ] && [ "$PINGGY_URL" != "null" ]; then
            echo "## 🌐 Option 1 (Recommended for All Networks & Mobile):" >> $GITHUB_STEP_SUMMARY
            echo "### 👉 **[CLICK HERE TO OPEN VIA PINGGY]($PINGGY_URL)** 👈" >> $GITHUB_STEP_SUMMARY
            echo "**Direct Link:** \`$PINGGY_URL\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$CLOUDFLARE_URL" ]; then
            echo "## ⚡ Option 2 (Cloudflare Tunnel):" >> $GITHUB_STEP_SUMMARY
            echo "### 👉 **[CLICK HERE TO OPEN VIA CLOUDFLARE]($CLOUDFLARE_URL)** 👈" >> $GITHUB_STEP_SUMMARY
            echo "**Direct Link:** \`$CLOUDFLARE_URL\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$LOCALTUNNEL_URL" ]; then
            echo "## 🔗 Option 3 (Localtunnel):" >> $GITHUB_STEP_SUMMARY
            echo "### 👉 **[CLICK HERE TO OPEN VIA LOCALTUNNEL]($LOCALTUNNEL_URL)** 👈" >> $GITHUB_STEP_SUMMARY
            echo "**Direct Link:** \`$LOCALTUNNEL_URL\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          cat << 'EOF' >> $GITHUB_STEP_SUMMARY

          ---
          ### 📋 Active Surveillance Capabilities
          - 🎥 **Real-time AI Video Feed**: Automated Face & Cheating Detection active.
          - 📝 **Candidate Examination Portal**: Live exam room & question simulator active.
          - 📊 **Live Proctor Dashboard**: Real-time violation counters & warning notifications active.
          - 📱 **Mobile & Desktop Friendly**: Accessible from phone, tablet, or PC without installing anything.

          ### 🛑 How to Stop or Restart
          - **To Stop**: Click the red **"Cancel run"** button at the top right when your exam session is complete.
          - **To Restart Later**: Open this Actions page and click **"Re-run all jobs"** (or trigger "AI Examination Surveillance" from the Actions tab).
          EOF

          # Determine duration (default 360 minutes = 6 hours max GitHub runner duration)
          DURATION_MINUTES="${{ github.event.inputs.duration_minutes || 360 }}"
          TOTAL_SECONDS=$((DURATION_MINUTES * 60))
          ELAPSED=0

          echo "Surveillance session active for up to $DURATION_MINUTES minutes (~$(( DURATION_MINUTES / 60 )) hours). Keeping tunnels alive..."

          # Heartbeat keep-alive loop
          while [ $ELAPSED -lt $TOTAL_SECONDS ]; do
            sleep 30
            ELAPSED=$((ELAPSED + 30))
            REMAINING=$(( (TOTAL_SECONDS - ELAPSED) / 60 ))
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] 🟢 Surveillance active ($REMAINING min remaining) | Primary: $PRIMARY_URL"

            # Check if backend crashed
            if ! kill -0 $BACKEND_PID 2>/dev/null; then
              echo "❌ Backend server stopped unexpectedly! Checking logs:"
              cat logs/application.log 2>/dev/null || true
              cat logs/errors.log 2>/dev/null || true
              exit 1
            fi
          done

          echo "Session duration limit ($DURATION_MINUTES minutes) reached. Shutting down."
