name: CI - AI Examination Surveillance

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Tests & Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies (OpenCV & Audio Libraries)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            portaudio19-dev \
            libasound2-dev \
            curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Environment
        run: |
          cp .env.example .env
          mkdir -p logs data/database data/screenshots backend/data/screenshots

      - name: Run Pytest Suite
        run: |
          pytest backend/tests -v

      - name: Verify Backend Server Boot & Health Endpoint
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          echo "Server running on PID $SERVER_PID. Waiting for startup..."
          sleep 6

          # Verify /api/status endpoint responds with HTTP 200
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/status)
          echo "Health check status response: $STATUS_CODE"
          if [ "$STATUS_CODE" != "200" ]; then
            echo "Health check failed with HTTP $STATUS_CODE"
            kill $SERVER_PID || true
            exit 1
          fi

          echo "Backend server successfully verified!"
          kill $SERVER_PID || true

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Linter (oxlint)
        working-directory: ./frontend
        run: npm run lint

      - name: Build Production Assets (Vite & TypeScript)
        working-directory: ./frontend
        run: npm run build

      - name: Upload Production Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
